<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html">
<h:head>
  <title>Formulário de Contato</title>
  <link rel="stylesheet" href="#{request.contextPath}/_css/main.css" />
</h:head>
<h:body>
  <h:form>
    <h2>Contato</h2>
    <div>
      <h:outputLabel for="nome" value="Nome:" />
      <h:inputText id="nome" value="#{contatoBean.nome}" styleClass="campo" />
    </div>
    <div>
      <h:outputLabel for="sobrenome" value="Sobrenome:" />
      <h:inputText id="sobrenome" value="#{contatoBean.sobrenome}" styleClass="campo" />
    </div>
    <div>
      <h:outputLabel for="fone" value="Fone:" />
      <h:inputText id="fone" value="#{contatoBean.fone}" styleClass="campo" />
    </div>
    <div>
      <h:outputLabel for="email" value="E-mail:" />
      <h:inputText id="email" value="#{contatoBean.email}" styleClass="campo" />
    </div>
    <div>
      <h:commandButton value="Enviar" action="#{contatoBean.enviar}" styleClass="botao" />
    </div>
  </h:form>
</h:body>
</html>
